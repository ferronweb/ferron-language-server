[package]
name = "ferron-language-server"
version = "0.1.2"
edition = "2021"
authors = ["Dorian Niemiec <dorian@ferron.sh>"]
description = "A language server (LSP) that allows editors to support `ferron.conf` and Ferron configuration files to improve configuration editing UX"
license = "MIT"
readme = "./README.md"
keywords = ["language-server", "lsp", "ferron"]
categories = ["development-tools"]
repository = "https://github.com/ferronweb/ferron-language-server"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tower-lsp = "0.20.0"
shadow-rs = { version = "2.0.0", default-features = false }
dirs = "7.0.0"
reqwest = "0.13.4"
async-compression = { version = "0.4.42", features = ["gzip", "tokio"] }
astral-tokio-tar = "0.7.0" # Using astral fork, because the upstream seems to be unmaintained
async_zip = { version = "0.0.19", features = ["tokio", "deflate"] }
futures-util = "0.3.33"
sanitize-filename = "0.6.0"
tokio-util = { version = "0.7.19", features = ["compat"] }
clap = { version = "4.6.4", features = ["derive"] }
ferronconf = { version = "0.5", features = ["lexer-public"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
shadow-rs = { version = "2.0.0", default-features = false, features = ["build", "std", "jiff"] }

[package.metadata.npm]
name = "ferron-language-server"
prefix = "@ferronweb/ferron-language-server-"
